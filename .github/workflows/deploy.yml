name: Deploy Netlify (1x per 3 hari)

on:
  schedule:
    # UTC; 06:35 setiap 3 hari (hari 1, 4, 7, ... tiap bulan). Tiap run TIDAK
    # otomatis mendeploy — hanya push ke main kalau ada perubahan baru dari
    # staging. Push ke main itulah pemicu build & deploy Netlify (netlify.toml).
    - cron: "35 6 */3 * *"
  workflow_dispatch:

concurrency:
  # Cegah dua run tumpang-tindih (mis. schedule + workflow_dispatch manual) yang
  # bisa menimpa main dengan merge commit berselang-seling / memicu >1 build
  # Netlify. `cancel-in-progress: false` => run yang sedang berjalan diselesaikan
  # dulu, run berikutnya menunggu gilirannya.
  group: deploy-main
  cancel-in-progress: false

jobs:
  merge-staging-ke-main:
    runs-on: ubuntu-latest
    # Batas aman: merge+push normal selesai <1 menit; cegah job hang menghabiskan
    # waktu runner. Kalau >15 menit berarti ada masalah yang butuh penanganan.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout (riwayat penuh)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge staging ke main (memicu 1 build Netlify)
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MAX_ATTEMPTS=5

          # Refetch dulu supaya cek keberadaan staging memakai state paling baru
          # (ref `origin/*` hasil clone checkout bisa saja sudah basi).
          git fetch --all --prune
          if ! git rev-parse --verify refs/remotes/origin/staging >/dev/null 2>&1; then
            echo "Belum ada branch staging - tidak ada yang dideploy."
            exit 0
          fi

          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "== Percobaan $i/$MAX_ATTEMPTS =="
            git fetch --all --prune

            # Selalu sinkronkan `main` lokal ke ujung `origin/main` (reset + checkout
            # sekaligus; tetap aman walau runner checkout dalam keadaan detached).
            git checkout -B main origin/main

            # Merge. Kalau gagal/konflik, bereskan state lalu coba lagi pada iterasi
            # berikutnya (refetch bisa saja menangkap perubahan remote yang menghapus
            # konflik tadi). `--abort || true` supaya job tidak mati di tengah loop.
            if ! git merge --no-edit origin/staging; then
              echo "Merge staging->main gagal/konflik (percobaan $i); diulang."
              git merge --abort || true
              continue
            fi

            # Tidak ada net-perubahan terhadap origin/main => tanpa push, tanpa
            # deploy (0 kredit). Bandingkan isi pohon, bukan hash, supaya merge
            # commit yang "kosong" juga benar-benar di-skip.
            if git diff --quiet origin/main; then
              echo "Tidak ada perubahan baru dari staging - tanpa push, tanpa deploy."
              exit 0
            fi

            if git push origin main; then
              echo "Push ke main berhasil - Netlify build & deploy."
              exit 0
            fi
            echo "Push main ditolak (percobaan $i); refetch & coba lagi."
          done

          # Semua percobaan habis: jangan diam-diam "sukses" - tandai gagal agar
          # terlihat di GitHub Actions dan bisa ditindaklanjuti manual.
          echo "::error::Merge/push staging->main masih gagal setelah $MAX_ATTEMPTS percobaan - tidak ada yang dideploy. Perlu penanganan manual."
          exit 1