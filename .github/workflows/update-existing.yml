name: Update Bab Otomatis (seri existing saja)

on:
  schedule:
    # UTC; 03:35 & 09:35 & 15:35 & 21:35 UTC (tiap 6 jam).
    # MODE UPDATE-ONLY: hanya memeriksa seri yang SUDAH ADA di katalog
    # (site-content/series/*.json) dan memperbarui bab/date/gambar-nya.
    # TIDAK scan halaman daftar, TIDAK menambah seri baru.
    - cron: "35 3,9,15,21 * * *"
  workflow_dispatch:

concurrency:
  group: update-existing
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Domain situs live Cloudflare Pages. Wajib diset di vars bila
      # bukan mfmam.pages.dev.
      SITE_URL: ${{ vars.SITE_URL || 'https://mfmam.pages.dev' }}
      # Kredensial Cloudflare: set di Settings -> Secrets:
      #   CLOUDFLARE_API_TOKEN (token dengan izin Pages:Edit + R2:Edit) dan
      #   CLOUDFLARE_ACCOUNT_ID.
      SCRAPE_IMAGES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore data katalog dari situs live
        run: |
          python _restore_data.py || true

      - name: Update seri existing saja (tanpa scan halaman / seri baru)
        env:
          SCRAPE_UPDATE_ONLY: "1"
          SCRAPE_AUTO_BUILD: "0"
          # Update-only: proses SEMUA seri tersimpan (jangan dibatasi batch).
          BATCH_LIMIT: ""
        run: |
          python scraper.py

      - name: Build situs statis (dist/)
        run: |
          python build.py
          echo "File di dist: $(find dist -type f | wc -l)"
          echo "Ukuran dist: $(du -sh dist | cut -f1)"
          echo "File data R2: $(find dist-data -type f | wc -l)"

      - name: Upload data katalog ke R2 (dist-data/ -> bucket mfmam-data)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID belum di-set."
            exit 1
          fi
          total=$(find dist-data/data -name '*.json' | wc -l)
          i=0
          for f in dist-data/data/*.json; do
            i=$((i+1))
            key=$(basename "$f")
            npx wrangler@4 r2 object put "mfmam-data/data/$key" \
              --file "$f" --remote --content-type application/json >/dev/null 2>&1 \
              || { echo "::error::Gagal upload $key"; exit 1; }
            if [ $((i % 50)) -eq 0 ] || [ "$i" -eq "$total" ]; then
              echo "Upload R2: $i/$total"
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy ke Cloudflare Pages
        id: deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID belum di-set."
            exit 1
          fi
          # TANPA --branch: setiap deploy langsung masuk PRODUCTION
          # (mfmam.pages.dev).
          npx wrangler@4 pages deploy dist \
            --project-name=${{ vars.PAGES_PROJECT || 'mfmam' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}