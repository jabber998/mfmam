name: Scraper Otomatis Mfmam

on:
  schedule:
    # UTC; 03:35 UTC = 10:35 WIB (sesuaikan bila perlu). Jalankan tiap 6 jam.
    - cron: "35 */6 * * *"
  workflow_dispatch: {}   # izinkan trigger manual dari tab Actions

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Jalankan scraper (judul bab + link, tanpa gambar)
        run: |
          python scraper.py

      - name: Commit & push hasil (bila ada perubahan)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan - selesai."
          else
            git commit -m "chore: update katalog dari scraper [skip netlify]"
            git push
          fi