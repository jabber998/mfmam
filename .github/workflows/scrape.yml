name: Scraper Penuh Mfmam (tambah seri baru, MANUAL)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Tempel URL mana saja yang ingin discrape (satu per baris): halaman seri / halaman daftar / slug sendiri. Kosongkan bila memakai ceklis sumber di bawah (atau sources.json)."
        required: false
        type: string
      scrape_komikindo:
        description: "PILIH SUMBER: centang untuk scrape KOMIKINDO (daftar komik-terbaru). Kosongkan semua ceklis = pakai sources.json penuh."
        required: false
        type: boolean
        default: false
      batch:
        description: "Jumlah manga yang diproses dalam batch ini."
        required: false
        type: number
        default: 20
      sitemap_url:
        description: "URL sitemap untuk import daftar seri lengkap (opsional), mis. https://komikindo.ch/sitemap.xml. Kosongkan untuk memakai sources.json."
        required: false
        type: string
      scrape_series_workers:
        description: "Jumlah seri yang diproses BERSAMAAN (paralel lintas-seri). 1 = satu per satu (perilaku lama); >1 = lebih cepat tapi ritme request ke sumber ikut meningkat."
        required: false
        type: number
        default: 1
      scrape_workers:
        description: "Jumlah worker paralel per-seri untuk mengambil gambar/tanggal bab (SCRAPE_WORKERS)."
        required: false
        type: number
        default: 4
      scrape_parallel_min:
        description: "Ambang jumlah bab agar mode paralel otomatis aktif (SCRAPE_PARALLEL_MIN), mis. 50 = paralel hanya bila bab yang diproses > 50."
        required: false
        type: number
        default: 50
      scrape_max_new:
        description: "Batas maksimal seri BARU (belum ada di katalog) yang boleh ditambahkan dalam sekali run (SCRAPE_MAX_NEW)."
        required: false
        type: number
        default: 200

concurrency:
  group: scrape-deploy
  cancel-in-progress: false

jobs:
  scrape-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Domain situs live Cloudflare Pages. Wajib diset di vars bila
      # bukan mfmam.pages.dev.
      SITE_URL: ${{ vars.SITE_URL || 'https://mfmam.pages.dev' }}
      # Kredensial Cloudflare: set di Settings -> Secrets:
      #   CLOUDFLARE_API_TOKEN (token dengan izin Pages:Edit) dan
      #   CLOUDFLARE_ACCOUNT_ID.
      SCRAPE_IMAGES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependensi (requests + Pillow utk mirror Blogger)
        run: |
          pip install --quiet requests pillow

      - name: Restore data dari situs live (incremental, tanpa git)
        run: |
          python _restore_data.py || true

      # Siapkan pilihan sumber. Bila ceklis dicentang, susun
      # manual-batch.txt (URL sumber terpilih) dan batasi adaptor lewat
      # SCRAPE_ADAPTERS. Bila kosong -> manual-batch tidak dibuat,
      # scraper memakai sources.json penuh (perilaku lama).
      - name: Siapkan pilihan sumber (hanya URL terpilih)
        id: pick
        if: github.event_name == 'workflow_dispatch'
        env:
          KOMI: ${{ inputs.scrape_komikindo }}
          URLS: ${{ inputs.urls }}
        run: |
          set -e
          mkdir -p site-content
          rm -f site-content/manual-batch.txt
          ADAPTERS=""
          if [ "$KOMI" = "true" ]; then
            ADAPTERS="$ADAPTERS komikindo"
            echo 'https://komikindo.ch/komik-terbaru/' >> site-content/manual-batch.txt
          fi
          if [ -n "$URLS" ]; then
            printf '%s\n' "$URLS" | tr -d '\r' | sed '/^[[:space:]]*$/d' >> site-content/manual-batch.txt
          fi
          if [ -s site-content/manual-batch.txt ]; then
            sed -i '/^$/d' site-content/manual-batch.txt
            echo "Manual-batch (URL yang diproses):"
            cat site-content/manual-batch.txt
          else
            rm -f site-content/manual-batch.txt
            echo "Tidak ada pilihan sumber khusus; memakai sources.json penuh."
          fi
          ADAPTERS=$(echo "$ADAPTERS" | xargs | tr ' ' ',')
          echo "SCRAPE_ADAPTERS=$ADAPTERS"
          echo "adapters=$ADAPTERS" >> "$GITHUB_OUTPUT"

      - name: Jalankan scraper (info seri + bab + gambar, incremental)
        env:
          BATCH_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.batch || '' }}
          SCRAPE_IMAGES: "1"
          # Adaptor/sumber yang diproses (hasil pilihan step `pick`). Kosong
          # bila tidak ada ceklis dicentang -> semua sumber berjalan.
          SCRAPE_ADAPTERS: ${{ steps.pick.outputs.adapters }}
          # Auto-build dimatikan di sini; `python build.py` dijalankan SEKALI
          # pada step berikutnya agar tidak membangun `dist/` berulang-ulang.
          SCRAPE_AUTO_BUILD: "0"
          SCRAPE_SITEMAP_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.sitemap_url || '' }}
          # Pemicu paralel lintas-seri & pengaturan paralel (bisa dikosongkan;
          # scraper_common memakai default bila env kosong/absen).
          SCRAPE_SERIES_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.scrape_series_workers || '' }}
          SCRAPE_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.scrape_workers || '' }}
          SCRAPE_PARALLEL_MIN: ${{ github.event_name == 'workflow_dispatch' && inputs.scrape_parallel_min || '' }}
          SCRAPE_MAX_NEW: ${{ github.event_name == 'workflow_dispatch' && inputs.scrape_max_new || '' }}
        run: |
          python scraper.py

      - name: Bersihkan file manual batch (sekali pakai)
        if: github.event_name == 'workflow_dispatch'
        run: |
          rm -f site-content/manual-batch.txt

      - name: Build situs statis (dist/)
        run: |
          python build.py
          echo "File di dist: $(find dist -type f | wc -l)"
          echo "Ukuran dist: $(du -sh dist | cut -f1)"
          echo "File data R2: $(find dist-data -type f | wc -l)"

      - name: Upload data katalog ke R2 (hanya yang berubah)
        id: upload
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID belum di-set."
            exit 1
          fi
          # _upload_r2.py membandingkan MD5 tiap file dist-data/data/<slug>.json
          # dengan state riwayat yang disimpan DI R2 (key .r2-state.json);
          # operasi R2 object put hanya dijalankan untuk file BARU atau BERUBAH
          # (bukan seluruh katalog), sehingga proses jauh lebih cepat.
          python _upload_r2.py > r2up.txt
          cat r2up.txt
          CHANGED=$(grep -o 'CHANGED:[0-9]*' r2up.txt | head -1 | cut -d: -f2)
          echo "changed=${CHANGED:-0}" >> "$GITHUB_OUTPUT"
        env:
          WRANGLER_CMD: "npx wrangler@4"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy ke Cloudflare Pages
        id: deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID belum di-set."
            exit 1
          fi
          # TANPA --branch: setiap deploy langsung masuk PRODUCTION
          # (mfmam.pages.dev). Bila memakai --branch=cabang lain, deploy akan
          # menjadi PREVIEW dengan URL acak *.pages.dev, bukan produksi.
          # wrangler.toml di root otomatis menyambungkan Pages Function
          # (functions/data/[slug].js) dengan binding R2 mfmam_data.
          npx wrangler@4 pages deploy dist \
            --project-name=${{ vars.PAGES_PROJECT || 'mfmam' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
