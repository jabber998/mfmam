name: Scraper Otomatis Mfmam

on:
  schedule:
    # UTC; 03:35 & 09:35 & 15:35 & 21:35 UTC (tiap 6 jam).
    - cron: "35 */6 * * *"
  workflow_dispatch:
    inputs:
      urls:
        description: "Tempel URL manga (satu per baris). Kosongkan untuk memakai sources.json."
        required: false
        type: string
      batch:
        description: "Jumlah manga yang diproses dalam batch ini."
        required: false
        type: number
        default: 20

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tulis URL manual (bila diisi di form)
        if: github.event_name == 'workflow_dispatch' && inputs.urls != ''
        env:
          BATCH: ${{ inputs.urls }}
        run: |
          mkdir -p site-content
          printf '%s\n' "$BATCH" | tr -d '\r' > site-content/manual-batch.txt

      - name: Jalankan scraper (info seri + bab + gambar, incremental)
        env:
          BATCH_LIMIT: ${{ inputs.batch }}
          SCRAPE_IMAGES: "1"
        run: |
          python scraper.py

      - name: Bersihkan file manual batch (sekali pakai)
        if: github.event_name == 'workflow_dispatch'
        run: |
          rm -f site-content/manual-batch.txt

      - name: Commit & push hasil (tahan "fetch first" / race)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan - selesai."
            exit 0
          fi
          git commit -m "chore: update katalog dari scraper"
          # Coba push; jika ditolak karena remote maju (race), tarik ulang lalu ulangi.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push berhasil."
              exit 0
            fi
            echo "Push ditolak (percobaan $i), tarik ulang perubahan remote..."
            git pull --rebase --autostash || true
          done
          echo "Push masih gagal setelah beberapa percobaan."
          exit 1