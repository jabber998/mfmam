name: Scraper Otomatis Mfmam

on:
  schedule:
    # UTC; 03:35 & 09:35 & 15:35 & 21:35 UTC (tiap 6 jam).
    - cron: "35 */6 * * *"
  workflow_dispatch:
    inputs:
      urls:
        description: "Tempel URL manga (satu per baris). Kosongkan untuk memakai sources.json."
        required: false
        type: string
      batch:
        description: "Jumlah manga yang diproses dalam batch ini."
        required: false
        type: number
        default: 20

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tulis URL manual (bila diisi di form)
        if: github.event_name == 'workflow_dispatch' && inputs.urls != ''
        env:
          BATCH: ${{ inputs.urls }}
        run: |
          mkdir -p site-content
          printf '%s\n' "$BATCH" | tr -d '\r' > site-content/manual-batch.txt

      - name: Jalankan scraper (judul bab + link, tanpa gambar)
        env:
          BATCH_LIMIT: ${{ inputs.batch }}
        run: |
          python scraper.py

      - name: Bersihkan file manual batch (sekali pakai)
        if: github.event_name == 'workflow_dispatch'
        run: |
          rm -f site-content/manual-batch.txt

      - name: Commit & push hasil (bila ada perubahan)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan - selesai."
          else
            git commit -m "chore: update katalog dari scraper [skip netlify]"
            git push
          fi