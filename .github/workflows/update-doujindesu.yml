name: Update Doujindesu (tiap 2 hari, 03:00 WIB)

on:
  schedule:
    # WIB = UTC+7. 03:00 WIB = 20:00 UTC (hari sebelumnya), tiap 2 hari;
    # ambil bab 2 hari terakhir.
    - cron: "0 20 */2 * *"
  workflow_dispatch:

concurrency:
  group: update-doujindesu
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://mfmam.pages.dev' }}
      SCRAPE_IMAGES: "1"
      SCRAPE_FRESH_HOURS: "48"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore data katalog dari situs live
        run: |
          python _restore_data.py || true

      - name: Update bab Doujindesu (2 hari terakhir)
        env:
          # SMART-UPDATE: scan halaman /explore/ (daftar terbaru via API),
          # lalu HANYA di-update seri yang SUDAH ADA di katalog (filter
          # smart-update). Seri baru (muncul di explore tapi belum ada di
          # katalog) tidak ditambahkan. Bab 2 hari terakhir lewat
          # SCRAPE_FRESH_HOURS, batas scan explore lewat DOUJIN_EXPLORE_MAX.
          SCRAPE_SMART_UPDATE: "1"
          SCRAPE_AUTO_BUILD: "0"
          SCRAPE_FRESH_HOURS: "48"
          DOUJIN_EXPLORE_MAX: "400"
          BATCH_LIMIT: ""
        run: |
          python scraper_doujindesu.py

      - name: Build situs statis (dist/)
        run: |
          python build.py
          echo "File di dist: $(find dist -type f | wc -l)"
          echo "File data R2: $(find dist-data -type f | wc -l)"

      - name: Upload data katalog ke R2 (hanya yang berubah)
        id: upload
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID belum di-set."
            exit 1
          fi
          python _upload_r2.py > r2up.txt
          cat r2up.txt
          CHANGED=$(grep -o 'CHANGED:[0-9]*' r2up.txt | head -1 | cut -d: -f2)
          echo "changed=${CHANGED:-0}" >> "$GITHUB_OUTPUT"
        env:
          WRANGLER_CMD: "npx wrangler@4"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy ke Cloudflare Pages
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID belum di-set."
            exit 1
          fi
          npx wrangler@4 pages deploy dist \
            --project-name=${{ vars.PAGES_PROJECT || 'mfmam' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}