<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin - Mfmam</title>
</head>
<body>
  <!-- Admin Netlify CMS (v2 klasik) — kompatibel penuh dengan Netlify Identity.
       Memroses #invite_token, #confirmation_token, #recovery_token tanpa hash routing v3. -->
  <script src="https://unpkg.com/netlify-cms@2.10.192/dist/netlify-cms.js"></script>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (!window.CMS) {
          document.body.innerHTML += '<p style="font-family:sans-serif;color:#b00;padding:20px">' +
            'Gagal memuat netlify-cms.js. Periksa koneksi internet / coba muat ulang.</p>';
        }
      }, 3000);
    });
  </script>
</body>
</html>
